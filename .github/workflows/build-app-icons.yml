name: Build SHIRAYUKI app icons
on:
  push:
    branches: [main]
    paths:
      - icon.svg
      - scripts/build-app-icons.py
      - .github/workflows/build-app-icons.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  create-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python scripts/build-app-icons.py
      - name: Commit raster icon assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add favicon-32.png apple-touch-icon.png icon-192.png icon-512.png icon-maskable-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate PNG app icons for SHIRAYUKI"
            git push
          fi
