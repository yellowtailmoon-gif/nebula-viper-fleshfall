function render(){g.save();if(shake>0)g.translate(rand(-shake,shake),rand(-shake,shake));renderBackground();drawPickups();drawEnemyGroup();if(mid)drawMajor(mid);if(boss)drawMajor(boss);drawBullets();drawBeams();if(player){if(player.inv<=0||Math.floor(now*12)%2===0){drawOptions();drawShip(player.x,player.y,now)}}drawParticles();drawHUD();if(flash>0){g.fillStyle=`rgba(255,206,194,${flash*.45})`;g.fillRect(0,0,480,800)}g.restore()}
function initEvents(){document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>{diff=b.dataset.diff;document.querySelectorAll('.mode').forEach(c=>c.classList.toggle('sel',c===b))}));startBtn.addEventListener('click',()=>{if(mode==='paused'){pause();return}startGame()});continueBtn.addEventListener('click',continueGame);bombBtn.addEventListener('pointerdown',e=>e.stopPropagation());bombBtn.addEventListener('click',e=>{e.stopPropagation();useBomb()});$('soundBtn').addEventListener('click',()=>{sound=!sound;$('soundBtn').textContent=sound?'♪ ON':'♪ OFF';if(sound)SFX(480,.1,'triangle',.03,720)});$('pauseBtn').addEventListener('click',pause);$('fullBtn').addEventListener('click',()=>{if(document.fullscreenElement){document.exitFullscreen?.()}else frame.requestFullscreen?.().catch(()=>{})});window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','Digit1','Digit2','Digit3'].includes(e.code))e.preventDefault();KEYS.add(e.code);if(e.repeat)return;if(e.code==='Space'||e.code==='KeyB')useBomb();if(e.code==='KeyP'||e.code==='Escape')pause();if(/^Digit[123]$/.test(e.code))selectPower(+e.code.slice(-1)-1)});window.addEventListener('keyup',e=>KEYS.delete(e.code));window.addEventListener('blur',()=>{if(mode==='playing')pause()});cv.addEventListener('pointerdown',e=>{if(mode!=='playing')return;e.preventDefault();cv.setPointerCapture(e.pointerId);drag={id:e.pointerId,x:e.clientX,y:e.clientY}});cv.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId||mode!=='playing')return;e.preventDefault();const rect=cv.getBoundingClientRect(),x=(e.clientX-drag.x)*W/rect.width,y=(e.clientY-drag.y)*H/rect.height;player.tx=clamp(player.tx+x,37,443);player.ty=clamp(player.ty+y,130,753);drag.x=e.clientX;drag.y=e.clientY});for(let typ of ['pointerup','pointercancel','lostpointercapture'])cv.addEventListener(typ,e=>{if(drag&&drag.id===e.pointerId)drag=null})}
function loop(t){let dt=last?Math.min(.033,(t-last)/1000):.016;last=t;tick(dt);render();requestAnimationFrame(loop)}
initEvents();bgCache[0]=makeBg(0);requestAnimationFrame(loop);
// Development-only inspection hook, without any effect on the normal game.
window.__FLESHFALL_DEV={stats:()=>({mode,diff,s,stageTime,score,hp:player?.hp,barrier:player?.barrier,weapon:player?.weapon,weaponLevel:player?.level,enemyCount:enemies.length,bulletCount:ebullets.length,pickups:pickups.length,bossHp:boss?.hp,midHp:mid?.hp,upgradeVisible:!!upChoice}),skipToMid:()=>{if(mode==='playing'){stageTime=49;if(!midTriggered)createMajor(false)}},skipToBoss:()=>{if(mode==='playing'){stageTime=101;midTriggered=true;midBeaten=true;mid=null;if(!bossTriggered)createMajor(true)}},power:()=>{if(mode==='playing')triggerChoice()},equip:(weapon,lv=2)=>{if(player){player.weapon=weapon;player.level=clamp(lv,1,3)}},defeatBoss:()=>{if(boss)majorDead(boss);else if(mid)majorDead(mid)},advance:seconds=>{let n=Math.ceil(seconds/.033);for(let i=0;i<n;i++)tick(.033)},invincible:seconds=>{if(player)player.inv=seconds},maxLoadout:()=>{if(player){player.weapon='vulcan';player.level=3;player.option=2;player.missile=2;player.barrier=3;player.bomb=5}},setBombMode:m=>{if(player){player.bombMode=m;refreshBomb()}}};
})();
