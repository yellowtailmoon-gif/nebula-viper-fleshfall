function musicStart(cue='stage'){
 // Preserve compatibility with older boolean calls, but choose a dedicated mid-boss score.

 musicStop();musicCue=cue;musicBoss=cue!=='stage';musicSegment=cue==='boss'?'solemn':cue==='mid'?'overture':'stage';musicTrack=s;

function drawCreature(entity,kind,opacity=1){

 g.save();g.globalAlpha=opacity;g.translate(entity.x,entity.y);

  g.globalCompositeOperation='screen';g.fillStyle=theme().accent+'60';g.beginPath();g.arc(Math.sin(entity.t*2)*4,w*.075,Math.max(4,w*.04),0,TAU);g.fill();

function inferMood(line='',urgent=false,role='captain'){
 const text=String(line||'');
 if(urgent||/危険|警告|崩壊|限界|撃墜|撤退|来る|被弾|急げ|最終|変形/.test(text))return 'alert';
 if(/援護|支援|回復|救援|守る|任せ|いける|大丈夫/.test(text))return 'support';
 if(/狙え|撃て|突破|前進|押し上げ|砲火|開け/.test(text))return 'command';

}

function transmit(role,line,duration=4.6,urgent=false){
 if(!comms||!line||!player)return;
 if(commTime>1.1){if(commQueue.length<5)commQueue.push({role,line,duration,urgent});return}
 const speaker=SPEAKERS[role]||{label:role};
 const mood=inferMood(line,urgent,role);
 commFrom.textContent=speaker.label||role;commLine.textContent=line; if(commAvatar) commAvatar.style.setProperty('background-image',speakerAvatar(role,mood),'important');
 if(comms) comms.dataset.mood=mood;
 comms.classList.toggle('urgent',urgent);comms.classList.add('show');commTime=Math.min(4.9,Math.max(3.1,duration*.85));commCooldown=urgent?.3:1.1;
 if(urgent)pickupSFX('comms');
}

function stageMessage(key,role,message,time=4.6,urgent=false){
 if(commFlags.has(key))return;commFlags.add(key);transmit(role,message,time,urgent);
}

 if(!launchActive)return;
 launchActive=false;skipLaunch.classList.remove('show');frame.classList.remove('launch');launchTime=0;

 safePeriod=Math.max(safePeriod,2.8);nextWave=.85;
 stageMessage('deployed','captain',MISSIONS[s][0],5.2,true);
 speak('SHIRAYUKI // SPEARHEAD INTERCEPTOR',240,390,'#b5f9ff',2.1,15);
}

function updateLaunch(dt){
 launchTime+=dt;if(launchTime>3.08)scroll+=dt*(140+3100*Math.pow(clamp((launchTime-3.08)/2.6,0,1),2));const beats=[.4,1.7,3.1,4.5,5.45],script=LAUNCH_SCRIPT[s]||LAUNCH_SCRIPT[0];
 while(launchBeat+1<beats.length&&launchTime>=beats[launchBeat+1]){
  launchBeat++;
  const cue=script[launchBeat];
  if(cue)transmit(cue[0],cue[1],cue[2],cue[3]);
  if(launchBeat===2){pickupSFX('launch');SFX(60,.92,'sawtooth',.095,1700);SFX(132,.52,'triangle',.060,2900);shake=Math.max(shake,12);}
  if(launchBeat===3&&allies[0]) stageMessage('wingLaunch','wing1',allyRadio('join',`${allies[0].name}、先行して露払いに出る！ ついてこい！`),4.2,true);
 }
 if(launchTime>=6.6)finishLaunch();
}

function choicesPool(){
 let pool=Object.keys(UPS).filter(id=>{
  if(id==='option'&&player.option>=3)return false;if(id==='aegis'&&player.aegis>=2)return false;if(id==='drone'&&player.drone>=2)return false;
  if(id==='missile'&&player.missile>=3)return false;if(id==='barrier'&&player.barrier>=5)return false;
  if(id==='bomb'&&player.bomb>=6)return false;if(id==='repair'&&player.hp>=player.maxhp)return false;
  if(id==='speed'&&player.speed>=1.36)return false;
  if(WEAPONS.includes(id)&&id===player.weapon&&player.level>=4)return false;
  if(['gravity','stasis','nova'].includes(id)&&player.bombMode===id)return false;
  if(['overdrive','rapid','focus','shockwave','chain','pierce','payload','echo','ioncore','armor','regen','magnet','salvage','cloak','warp','mines','homing','thruster','reactor','phase'].includes(id)&&player[id]>=2)return false;
  if(id==='twin'&&player.twin>=1)return false;
  return true;
 });
 // Shuffle with a seeded-ish Fisher-Yates; no undefined item may ever enter the UI.
 for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
 const primary=pool.filter(id=>WEAPONS.includes(id)||['option','aegis','missile','drone','twin','barrier'].includes(id));
 if(primary.length){let preferred=primary[Math.floor(Math.random()*primary.length)];pool=pool.filter(id=>id!==preferred);pool.unshift(preferred)}
 return pool.slice(0,3);
}

 const kind=['purge','cleanse'].includes(type)?type:(boss?'cleanse':mid?Math.random()<.76?'cleanse':'purge':Math.random()<.52?'purge':'cleanse');
 let p=makePickup(clamp(player.x+rand(-55,55),55,420),Math.max(125,player.y-190),kind);
 p.life=15;p.vy=60;p.r=20;p.rescue=true;
 rescueCooldown=25+Math.random()*19;rescueDistress=0;rescueSpawned++;
 ring(p.x,p.y,kind==='purge'?'#ff9acf':'#9aefff',90,145);
 speak(kind==='purge'?'EMERGENCY // PURGE':'EMERGENCY // CLEANSE',240,430,'#d6ffff',2,14);
 pickupSFX('comms');stageMessage('rescue','engineer','緊急支援カプセル投下！ 受け取って、まだ戦える！',3.3,true);return true
}
function updateRescue(dt){
 if(!player||mode!=='playing')return;
 rescueCooldown=Math.max(0,rescueCooldown-dt);
 // Critical hull or critical projectile density with depleted shields is a distress state.
 const critical=player.hp<=Math.ceil(player.maxhp*.4)&&player.barrier===0;
 const pressured=player.hp<player.maxhp&&player.barrier<=1&&ebullets.length>=Math.round(34*D.density);
 if(critical||pressured){
  rescueDistress+=dt;
  if(rescueCooldown<=0&&!pickups.some(p=>p.rescue)&&(Math.random()<dt*(critical?.30:.15)||rescueDistress>9))spawnRescue();
 }else rescueDistress=Math.max(0,rescueDistress-dt*2);
}
function getPickup(p){score+=150;switch(p.type){case 'chip':triggerChoice();break;case 'barrier':player.barrier=Math.min(5,player.barrier+1);break;case 'bomb':player.bomb=Math.min(6,player.bomb+1);break;case 'repair':player.hp=Math.min(player.maxhp,player.hp+1);break;case 'missile':player.missile=Math.min(3,player.missile+1);break;case 'purge':emergencyPurge();break;case 'cleanse':emergencyCleanse();break}refreshBomb();if(!p.rescue&&p.type!=='chip')pickupSFX(p.type)}

function radialShot(x,y,n=11,spd=138,angle=0,gap=0){let toward=Math.atan2(player.y-y,player.x-x);for(let i=0;i<n;i++){const a=i*TAU/n+angle;if(gap&&Math.abs(Math.atan2(Math.sin(a-toward),Math.cos(a-toward)))<gap/2)continue;spawnBullet(x,y,Math.cos(a)*spd,Math.sin(a)*spd,i%3?'glob':'thorn',4.4)}}

 else if(t==='screamer'){for(let i=0;i<6;i++){let a=Math.PI*.26+i*.19+Math.sin(e.t*3)*.42;spawnBullet(x,y,Math.cos(a)*160,Math.sin(a)*160,'acid',4.6)}}
 else if(t==='warden'){laneCurtain(8,190);aimShot(x,y,3,.34,183,'metal')}

 e.shoot=(t==='ace'?1.0:t==='carrier'?1.65:t==='leech'?2.8:t==='eye'?2.3:t==='plate'?2.1:t==='turret'?2:t==='warden'?2.6:t==='harpoon'?2.4:t==='sentinel'?1.95:2.0)*rand(.9,1.2)/D.density;
}
function moveEnemy(e,dt){e.t+=dt;e.inv=Math.max(0,e.inv-dt);e.flash=Math.max(0,e.flash-dt);e.shoot-=dt;

 case 'razor':e.y+=spd*dt;e.x=b+Math.sin(t*4.7+e.seed)*60;break;
 case 'spore':e.y+=spd*(e.y<250?1:.5)*dt;e.x=b+Math.sin(t*1.4+e.seed)*37;break;
 case 'plate':e.y+=spd*dt;e.x=b+Math.sin(t*.7+e.seed)*20;break;
 case 'stalker':e.y+=spd*.85*dt;e.x=b+Math.sin(t*2.45+e.seed)*110;break;
 case 'shrike':e.y+=spd*.9*dt;e.x=b+Math.sin(t*2.5+e.seed)*57;break;
 case 'carrier':e.y+=spd*.75*dt;e.x=b+Math.sin(t*.8)*35;break;
 case 'harpoon':e.y+=spd*(e.y<210?.6:1.5)*dt;e.x=b+Math.sin(t*3+e.seed)*49;break;
 case 'turret':e.y+=spd*dt;e.x=b+Math.sin(t*.38+e.seed)*17;break;
 case 'mimic':e.y+=spd*.68*dt;e.x=b+Math.sin(t*3.2+e.seed)*90;break;
 case 'screamer':e.y+=spd*.83*dt;e.x=b+Math.sin(t*1.6+e.seed)*115;break;
 case 'warden':e.y+=spd*.56*dt;e.x=b+Math.sin(t*.45+e.seed)*36;break;
 case 'urchin':e.y+=spd*(e.y<340?1:.62)*dt;e.x=b+Math.cos(t*2+e.seed)*78;break;
 case 'sentinel':e.y+=spd*.65*dt;e.x=b+Math.sin(t*1.1+e.seed)*90;break;
 case 'ace':{
  if(e.y<174)e.y+=135*dt;else{e.y=lerp(e.y,214+Math.sin(t*1.7)*28,dt*2);let dest=clamp(player.x+Math.sin(t*3.5+e.seed)*130,40,440);e.x+=clamp((dest-e.x)*dt*3,-spd*dt*2.4,spd*dt*2.4);e.rot=clamp((dest-e.x)*.0013,-.24,.24)}
  if(e.t>14){e.pass++;e.t=2;e.y=-60;e.x=rand(70,410);e.shoot=1.3}break}}
 // Stage-specific enemy temperament changes trajectories mid-flight.
 if(e.type!=='ace'&&e.type!=='turret'&&e.y>65&&e.y<620){
  if(s===0&&e.type==='leech'){e.x+=Math.sin(t*7.6+e.seed)*27*dt;e.rot=Math.sin(t*7.6)*.16}
  else if(s===1&&e.type==='razor'){e.x+=Math.sin(t*4+e.seed)*37*dt;e.rot=Math.sin(t*1.9)*.48}
  else if(s===2&&['spore','screamer'].includes(e.type)){e.y+=Math.sin(t*5+e.seed)*15*dt;e.rot=Math.sin(t*2.5)*.22}
  else if(s===3&&e.type==='warden'){e.y+=Math.sin(t*3)*11*dt;e.rot=Math.sin(t)*.13}
  else if(s===4&&e.type==='mimic'){e.x+=Math.sin(t*4.4)*56*dt;e.rot=Math.sin(t*2.2)*.65}
  else if(s===5&&e.type==='carrier'){e.x+=Math.sin(t*1.4)*26*dt;e.rot=Math.sin(t*1.2)*.17}
  else if(s===6&&e.type==='harpoon'){e.rot=Math.sin(t*2.5)*.70}
  else if(s===7&&e.type==='razor'){e.x+=Math.sin(t*7.0)*90*dt;e.rot=Math.cos(t*3)*.25}
  else if(s===8&&e.type==='sentinel'){e.rot=Math.sin(t*.8)*.38}
  else if(s===9&&e.type==='urchin'){e.rot=t*.95}
 }
 e.x=clamp(e.x,17,463);if(e.shoot<=0&&e.inv<=0){enemyShoot(e)}
 if(e.y>H+90){let idx=enemies.indexOf(e);if(idx>=0)enemies.splice(idx,1)}
}
// Five flagship bosses: different attack grammars and visible, time-delayed cues.
const BOSS_TACTICS=[
 {name:'CERBERUS / ORBITAL RAIL LOCK',color:'#55bcff',hint:'誘導照準を見て側方へ。レーザーは予告線の後に発射'},
 {name:'CARRION / CRYSTAL STORM',color:'#c3f5ff',hint:'氷晶の壁には必ず避難通路。発光した隙間を探せ'},
 {name:'GRAVEN / WRECKAGE CROSS-FIRE',color:'#a3c3ef',hint:'衛星残骸の左右から交差砲撃。視線を動かして回避'},
 {name:'SYNAPSE / NEURAL BLOOM',color:'#7affc9',hint:'渦巻く神経弾は回転方向を見切れ。中枢の脈動に注目'},
 {name:'UMBRA / HEART OF THE FORTRESS',color:'#ff749c',hint:'交互に閉じる門と脈動するコア。砲撃直前に回避'}

function bossCue(x,y,kind='danger',delay=.88,payload={}){
 bossCues.push({x,y,kind,delay,max:delay,stage:s,payload});
 if(bossCues.length>18)bossCues.shift();
}
function updateBossCues(dt){
 for(let i=bossCues.length-1;i>=0;i--){let c=bossCues[i];c.delay-=dt;
  if(c.delay>0)continue;
  if(c.stage===s&&player&&mode==='playing'){
   if(c.kind==='rail')triggerBeam(c.x,22+Math.min(12,s*3),.38);
   else if(c.kind==='mortar')aimShot(c.x,c.y,3,.26,182+s*9,c.payload.ammo||'metal');
   else if(c.kind==='shard')for(let v=-1;v<=1;v++)spawnBullet(c.x,c.y,v*33,170+s*8,'crystal',6.0);
   else if(c.kind==='heart')radialShot(c.x,c.y,10+2*(boss?.phase||0),162+s*8,now*.51,.45);
   else if(c.kind==='coil')aimShot(c.x,c.y,4,.44,176+s*9,'acid');
  }
  bossCues.splice(i,1);
 }
}
function drawBossCues(){
 for(const c of bossCues){const pr=1-c.delay/Math.max(.01,c.max),color=BOSS_TACTICS[c.stage]?.color||'#fff';g.save();
  g.globalAlpha=.48+.37*Math.sin(now*14)**2;g.strokeStyle=color;g.shadowColor=color;g.shadowBlur=10;g.lineWidth=1.4+pr*1.7;
  if(c.kind==='rail'){g.setLineDash([8,7]);g.beginPath();g.moveTo(c.x,80);g.lineTo(c.x,792);g.stroke();g.setLineDash([]);g.beginPath();g.ellipse(c.x,220,13+pr*13,17+pr*10,0,0,TAU);g.stroke()}
  else{g.beginPath();g.arc(c.x,c.y,15+pr*22,0,TAU);g.stroke();g.beginPath();g.moveTo(c.x-23,c.y);g.lineTo(c.x+23,c.y);g.moveTo(c.x,c.y-23);g.lineTo(c.x,c.y+23);g.stroke()}
  g.restore();
 }
}
function exclusiveBossAttack(e,spd,step,x,y,ph){
 // Do not erase every shot: pressure and counterplay depend on readable warnings.
 const base=step%(ph===2?5:4);
 switch(s){
 case 0: // Orbital siege cannons. Tracked x-lanes plus convergent escorts.
  if(base===0){bossCue(clamp(player.x+35,35,445),165,'rail',.95);e.shoot=1.7}
  else if(base===1){aimShot(x-57,y,3,.36,spd*.99,'metal');aimShot(x+57,y,3,.36,spd*.99,'ion');e.shoot=1.23}
  else if(base===2){for(let i=0;i<8+ph*2;i++){const xx=25+i*430/(7+ph*2);if(Math.abs(xx-player.x)<67)continue;spawnBullet(xx,-10,Math.sin(i+step)*35,spd*1.11,'metal',5.2)}e.shoot=1.58}
  else{bossCue(clamp(player.x-70,30,450),165,'rail',.92);if(ph>=2)bossCue(clamp(player.x+90,30,450),165,'rail',.92);e.shoot=1.75}break;
 case 1: // Ice: narrow navigable fault in an avalanche, then lateral shards.
  if(base===0){const safe=clamp(player.x+rand(-45,45),92,390);for(let i=0;i<14+ph*2;i++){let xx=20+i*440/(13+ph*2);if(Math.abs(xx-safe)<93)continue;bossCue(xx,34,'shard',.69+Math.random()*.16)}e.shoot=1.85}
  else if(base===1){for(let i=0;i<7;i++){let yy=115+i*63;spawnBullet(i%2===0?-12:492,yy,(i%2===0?1:-1)*spd*.87,spd*.34,'crystal',5.5)}e.shoot=1.6}
  else if(base===2){aimShot(x-45,y,4,.62,spd*.91,'bone');aimShot(x+45,y,4,.62,spd*.91,'bone');e.shoot=1.48}
  else{for(let i=0;i<10+ph*2;i++){let a=i*TAU/(10+ph*2)+now*.28;spawnBullet(x,y,Math.cos(a)*spd*.75,Math.sin(a)*spd*.75,'crystal',5)}e.shoot=1.68}break;
 case 2: // Satellite wreckage: left/right crossing sniper volleys + delayed charges.
  if(base===0){bossCue(80+((step*61)%320),120,'mortar',.88,{ammo:'metal'});bossCue(400-((step*47)%320),120,'mortar',.95,{ammo:'metal'});e.shoot=1.6}
  else if(base===1){for(let i=0;i<7+ph*2;i++){const left=i%2===0;spawnBullet(left?-10:490,80+i*61,(left?1:-1)*spd*1.14,spd*.24,'metal',6)}e.shoot=1.5}
  else if(base===2){aimShot(x-66,y,5,.51,spd*1.04,'ion');e.shoot=1.16}
  else{for(let i=0;i<5;i++){let xx=52+i*94;spawnBullet(xx,-15,Math.sin(step+i)*78,spd*.89,'bone',6)}e.shoot=1.72}break;
 case 3: // Neuron: living helical patterns with deliberate gap and toxic bursting roots.
  if(base===0){radialShot(x,y,12+ph*3,spd*.77,e.t*(.61+ph*.16),.65);e.shoot=1.58}
  else if(base===1){bossCue(clamp(player.x+Math.sin(now*1.3)*70,45,435),210,'coil',.82);e.shoot=1.4}
  else if(base===2){for(let i=0;i<11+ph*3;i++){let a=i*TAU/(11+ph*3)-e.t*.58;spawnBullet(x+Math.cos(a)*50,y+Math.sin(a)*27,Math.cos(a)*spd*.75,Math.sin(a)*spd*.75,'acid',4.8)}e.shoot=1.62}
  else{aimShot(x-65,y,4,.6,spd*.85,'acid');aimShot(x+65,y,4,.6,spd*.85,'ion');e.shoot=1.51}break;
 case 4: // Fortress heart: paired gate lasers and heartbeat pulses.
  if(base===0){bossCue(clamp(player.x-84,35,445),175,'rail',1.05);bossCue(clamp(player.x+84,35,445),175,'rail',1.05);e.shoot=1.75}
  else if(base===1){bossCue(x,y,'heart',.84);e.shoot=1.45}
  else if(base===2){for(let i=0;i<14+ph*3;i++){let a=i*TAU/(14+ph*3)+e.t*.36;if(Math.abs(Math.atan2(Math.sin(a-Math.PI/2),Math.cos(a-Math.PI/2)))<.32)continue;spawnBullet(x,y,Math.cos(a)*spd*.89,Math.sin(a)*spd*.89,'void',5.3)}e.shoot=1.64}
  else{aimShot(x-44,y,6,.45,spd*.94,'void');aimShot(x+44,y,6,.45,spd*.94,'ion');e.shoot=1.38}break;
 }
 // Hard mode gets tighter recovery but not twice the bullet count.
 e.shoot=Math.max(.88,e.shoot/(.77+D.density*.24)*(ph===2?.92:1));
}

const ACOUSTIC_SCORES=window.SHIRA_ACOUSTIC_SCORES||{};

// Cinematic sampled orchestra: pre-rendered, ORIGINAL compositions from a GM
// acoustic-instrument soundfont (strings, brass, piano, harp, choir, percussion).
// No oscillator-based synthesizer melodies in game BGM. SFX remain generated.
let orchestralActive=null,orchestralMix=[],orchestralClock=null;
function sampledAudioEntry(id){return ACOUSTIC_SCORES[id]||ACOUSTIC_SCORES['0_stage']}
function orchestrateClose(track){if(!track||!track.el)return;try{track.el.pause();track.el.removeAttribute('src');track.el.load()}catch(_){}}
function orchestrateFade(track,to,secs=.62){if(!track)return;track.from=track.rawVolume??track.el.volume;track.target=to;track.elapsed=0;track.fadeFor=Math.max(.04,secs)}
function orchestrateNew(id,position=0){
 const asset=sampledAudioEntry(id),el=new Audio();el.preload='auto';el.src=asset.uri;el.volume=0;el.loop=false;
 const tr={id,asset,el,from:0,rawVolume:0,target:1,elapsed:0,fadeFor:.6,looping:false};
 if(position>0){const seek=()=>{try{el.currentTime=position}catch(_){}};el.addEventListener('loadedmetadata',seek,{once:true})}
 el.addEventListener('ended',()=>{
   if(orchestralActive!==tr)return;
   try{el.currentTime=asset.loop||0;el.play().catch(()=>{})}catch(_){}
 });
 el.play().catch(e=>{console.warn('Acoustic score playback unavailable',e?.name||e)});
 orchestralMix.push(tr);return tr;
}
function orchestralTick(){
 const dt=.075;
 for(let i=orchestralMix.length-1;i>=0;i--){const tr=orchestralMix[i];
  if(tr.fadeFor){tr.elapsed+=dt;let p=Math.min(1,tr.elapsed/tr.fadeFor);tr.rawVolume=Math.max(0,Math.min(1,tr.from+(tr.target-tr.from)*(p*p*(3-2*p))));if(p>=1){tr.fadeFor=0;if(tr.target===0){orchestrateClose(tr);orchestralMix.splice(i,1);continue}}}
  tr.el.volume=Math.max(0,Math.min(1,(tr.rawVolume??tr.target)*1));
 }
 const tr=orchestralActive;if(!tr||!tr.el||!tr.el.duration||!Number.isFinite(tr.el.duration))return;
 const position=tr.el.currentTime, length=tr.el.duration;
 if(musicCue==='boss')musicSegment=position<4.8?'solemn':position<(tr.asset.loop||13)?'rising':position<length*.7?'combat':'inferno';
 else musicSegment=musicCue==='mid'?'epic':'stage';

 // Double-buffer the same pre-rendered orchestral recording for a 650ms

 if(!tr.looping && length>5 && position>length-.90){
   tr.looping=true;
   const next=orchestrateNew(tr.id,tr.asset.loop||0);
   orchestrateFade(tr,0,.72);orchestrateFade(next,1,.72);
   orchestralActive=next;

}
musicStop = function(){

  if(orchestralActive)return; // A rapid resume owns the current mix.
  if(orchestralClock!==null){clearInterval(orchestralClock);orchestralClock=null}
  for(const t of orchestralMix)orchestrateClose(t);
  orchestralMix=[];
 },500);
}
musicStart = function(cue='stage'){
 if(typeof cue==='boolean')cue=cue?'boss':'stage';
